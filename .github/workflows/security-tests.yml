name: Security regression tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test PAM policy and cryptography
        run: make -C pam test
      - name: Test Swift modules
        run: swift test --build-system native
      - name: Build release app and CLI
        run: swift build -c release --build-system native
