<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>immurok — Interactive experience review</title>
<style>:root{color-scheme:light dark}body{margin:0;padding:24px;background:light-dark(#e9e9ed,#171719)}#im-preview{max-width:1000px;margin:auto}@media(max-width:540px){body{padding:8px}}</style>
</head>
<body>
<div id="im-preview">
<style>
#im-preview{--im-bg:light-dark(#fafafa,#232325);--im-panel:light-dark(#f0f0f2,#2c2c2f);--im-text:light-dark(#202124,#f1f1f3);--im-sub:light-dark(#595960,#b9b9c1);--im-line:light-dark(#d8d8de,#49494f);--im-blue:light-dark(#0068d9,#78b5ff);--im-soft:light-dark(#e9f2ff,#25374d);--im-good:light-dark(#23743d,#87d9a0);--im-warn:light-dark(#925000,#ffca7c);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--im-text)}
#im-preview *{box-sizing:border-box}#im-preview button,#im-preview select{font:inherit;color:inherit;cursor:pointer}#im-preview button{border:1px solid var(--im-line);background:var(--im-bg);border-radius:7px;padding:7px 13px}#im-preview button:disabled{opacity:.45;cursor:default}#im-preview button:focus-visible,#im-preview select:focus-visible{outline:3px solid var(--im-blue);outline-offset:3px}#im-preview .primary{background:var(--im-blue);color:light-dark(#fff,#10243e);border-color:transparent}#im-preview .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#im-preview .spread{justify-content:space-between}#im-preview .window{background:var(--im-bg);border:1px solid var(--im-line);border-radius:13px;overflow:hidden}#im-preview .chrome{padding:16px 22px;background:var(--im-panel);border-bottom:1px solid var(--im-line)}#im-preview .brand{font-weight:600;letter-spacing:.3px}#im-preview .badge{font-size:12px;color:var(--im-sub)}#im-preview .nav{margin-top:12px}#im-preview .nav button[aria-pressed=true]{background:var(--im-soft);color:var(--im-blue);border-color:var(--im-blue)}#im-preview .content{padding:26px;min-height:460px}#im-preview h2{font-size:23px;line-height:1.25;margin:0 0 8px;font-weight:600}#im-preview h3{font-size:16px;margin:0 0 7px;font-weight:600}#im-preview p{margin:0 0 16px}#im-preview .muted{color:var(--im-sub)}#im-preview .eyebrow{color:var(--im-blue);font-size:12px;font-weight:600;margin-bottom:10px}#im-preview .choices{display:grid;gap:12px;margin-top:22px}#im-preview .choice{display:flex;align-items:flex-start;text-align:left;gap:14px;width:100%;padding:16px;border-radius:12px;background:var(--im-panel)}#im-preview .choice[aria-pressed=true]{background:var(--im-soft);border-color:var(--im-blue)}#im-preview .choice strong{display:block;font-weight:600;margin-bottom:3px}#im-preview .choice .mark{margin-left:auto;color:var(--im-blue)}#im-preview .actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--im-line)}#im-preview .detail{background:var(--im-panel);padding:18px;border-radius:12px;margin:20px 0}#im-preview .status{padding:20px;border-radius:12px;background:var(--im-soft);margin:20px 0}#im-preview .check{color:var(--im-good)}#im-preview .warning{color:var(--im-warn)}#im-preview .kv{display:grid;grid-template-columns:160px 1fr;gap:10px;margin:16px 0}#im-preview .kv span:nth-child(odd){color:var(--im-sub)}#im-preview select{background:var(--im-bg);border:1px solid var(--im-line);border-radius:7px;padding:7px;max-width:100%}#im-preview .dialog{max-width:560px;margin:22px auto;border:1px solid var(--im-line);border-radius:14px;padding:24px;background:var(--im-bg);box-shadow:0 8px 28px light-dark(#00000012,#00000035)}#im-preview code{font:13px/1.6 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere;white-space:pre-wrap}#im-preview .footer{padding:12px 22px;border-top:1px solid var(--im-line);color:var(--im-sub);font-size:12px}#im-preview .labs{margin-top:20px;padding-top:16px;border-top:1px dashed var(--im-line)}#im-preview .stepmark{width:50px;height:50px;display:grid;place-items:center;background:var(--im-soft);border-radius:14px;color:var(--im-blue);margin-bottom:18px}#im-preview ul{padding-left:20px}#im-preview li{margin:7px 0}@media(max-width:540px){#im-preview .content{padding:18px;min-height:0}#im-preview .chrome{padding:14px}#im-preview .kv{grid-template-columns:1fr;gap:3px}#im-preview .dialog{padding:17px}#im-preview button{min-height:44px}}
</style>
<div class="window">
<header class="chrome"><div class="row"><span class="brand">immurok</span><span class="badge">INTERACTIVE PREVIEW · SAMPLE DATA</span></div><nav class="row nav" aria-label="Preview screens"><button data-view="setup" aria-pressed="true">Onboarding</button><button data-view="approval" aria-pressed="false">Approval dialogs</button><button data-view="device" aria-pressed="false">Device status</button></nav></header>
<main class="content" id="im-content" aria-live="polite"></main><footer class="footer">Simulation only · No Bluetooth, USB, Keychain, system settings, or command access</footer>
</div>
<script>
(()=>{
const root=document.getElementById('im-preview'), main=root.querySelector('#im-content');
const initial={view:'setup',features:[],step:0,done:[],scenario:'ready',request:'admin',outcome:'waiting',seconds:30,history:[]};
let s={...initial};let ticker;
const features={unlock:['Screen unlock','Unlock your Mac with a fingerprint. Requires a saved login password and Accessibility permission.','lock-keyhole'],admin:['Administrator approval','Approve supported administrator requests with your fingerprint. Requires secure PAM setup.','shield-check'],ssh:['SSH signing','Use your fingerprint for SSH key operations. Keep your existing default agent unless you choose otherwise.','terminal']};
const steps=()=>['features','connect','pair','enroll',...(s.features.includes('unlock')?['password','accessibility']:[]),...(s.features.includes('admin')?['pam']:[]),'finish'];
const stepInfo={connect:['Connect your immurok','Use Bluetooth to communicate with your Mac. USB-C provides power; plugging it in does not complete Bluetooth setup.','Sample device: immurok · Nearby','Simulate Bluetooth connection','bluetooth'],pair:['Trust this device','Pair your immurok with this Mac before using authentication features.','A fresh connection must verify the device identity.','Simulate verified pairing','shield-check'],enroll:['Add your fingerprint','Follow the device prompts to enroll a fingerprint. Fingerprint enrollment happens on the device.','Sample enrollment · No biometric data is collected in this preview.','Simulate fingerprint enrollment','fingerprint'],password:['Set up screen unlock','Screen unlock needs your Mac login password stored in Keychain. This is only required for screen unlock.','No password entry in this preview. A sample saved-password state is used.','Simulate Keychain save','key-round'],accessibility:['Allow screen unlock assistance','Accessibility permission lets immurok enter your saved password at the login screen.','In the app, this step opens macOS System Settings.','Simulate permission granted','accessibility'],pam:['Set up administrator approval','Provision secure PAM authentication before enabling administrator requests.','In the app, this requires macOS authorization and a protected authentication key.','Simulate secure setup','shield-check']};
const statuses={ready:['Ready for fingerprint approval','Your sample device is connected, paired, and verified.','Review approval','check'],disconnected:['Device disconnected','Move immurok closer and wake it. USB-C power does not replace the Bluetooth connection.','Simulate reconnect','warning'],permission:['Bluetooth permission needed','Allow immurok in macOS Privacy & Security → Bluetooth.','Simulate permission granted','warning'],off:['Bluetooth is off','Turn on Bluetooth to reconnect to your device.','Simulate Bluetooth on','warning'],unverified:['Device identity not verified','Reconnect to retry device verification. Authentication stays unavailable until verification succeeds.','Simulate verified reconnect','warning'],enroll:['Add a fingerprint','Enroll a fingerprint on your device before enabling fingerprint approval.','Simulate enrollment','warning'],password:['Screen unlock needs a password','Save your Mac login password in Keychain to finish screen unlock setup.','Simulate password saved','warning'],accessibility:['Accessibility permission needed','Screen unlock requires permission in macOS System Settings.','Simulate permission granted','warning'],pam:['Administrator approval needs setup','Provision secure PAM authentication before enabling administrator requests.','Simulate secure setup','warning'],low:['Battery is low','Your sample battery is at 12%. Connect USB-C power to charge; keep Bluetooth connected.','Simulate charged device','warning']};
function save() {}
const icon=n=>`<span aria-hidden="true">${({'check':'✓','shield-check':'✓','circle-alert':'!','shield-x':'×','fingerprint':'◎','bluetooth':'↔','lock-keyhole':'◇','key-round':'◇','accessibility':'◉','terminal':'>_'})[n]||'◇'}</span>`;
function setup(){const list=steps(), step=list[s.step];let body='';if(step==='features'){body=`<h2>Make your Mac yours.</h2><p class="muted">Choose what you want immurok to do. We’ll ask only for the setup those features need.</p><div class="choices">${Object.entries(features).map(([key,f])=>`<button class="choice" data-feature="${key}" aria-pressed="${s.features.includes(key)}">${icon(f[2])}<span><strong>${f[0]}</strong><span class="muted">${f[1]}</span></span><span class="mark">${s.features.includes(key)?'●':'○'}</span></button>`).join('')}</div>`;}else if(step==='finish'){const missing=list.filter(x=>stepInfo[x]&&!s.done.includes(x));body=`<div class="stepmark">${icon(missing.length?'circle-alert':'check')}</div><h2>${missing.length?'A few things still need attention':'You’re ready to get started'}</h2><p class="muted">Only features with completed requirements will be enabled.</p><div class="detail">${s.features.map(k=>{const req=['connect','pair','enroll',...(k==='unlock'?['password','accessibility']:[]),...(k==='admin'?['pam']:[])];const ok=req.every(x=>s.done.includes(x));return `<p class="${ok?'check':'warning'}">${ok?'✓':'○'} ${features[k][0]} · ${ok?'Ready':'Setup incomplete'}</p>`;}).join('')}</div><p class="muted">Background update checks and keeping your Mac awake stay off. Your existing SSH agent remains unchanged.</p>${missing.length?`<button data-act="resume">Resume incomplete setup</button>`:''}`;}else{const d=stepInfo[step],done=s.done.includes(step);body=`<div class="stepmark">${icon(d[4])}</div><h2>${d[0]}</h2><p class="muted">${d[1]}</p><div class="detail"><p>${d[2]}</p><span class="${done?'check':'muted'}" role="status">${done?'✓ Completed in preview':'Waiting for simulated setup'}</span></div><button class="primary" data-act="complete" ${done?'disabled':''}>${done?'Completed':d[3]}</button>`;}
return `<div class="eyebrow">SETUP · STEP ${s.step+1} OF ${list.length}</div>${body}<div class="actions"><button data-act="back" ${s.step===0?'disabled':''}>Back</button><div class="row">${['password','accessibility','pam'].includes(step)&&!s.done.includes(step)?'<button data-act="skip">Set up later</button>':''}<button class="primary" data-act="next" ${(step==='features'?!s.features.length:step!=='finish'&&!s.done.includes(step))?'disabled':''}>${step==='finish'?'Done':'Continue'}</button></div></div>`;}
function approval(){const waiting=s.outcome==='waiting';const request=s.request;return `<div class="row spread"><label for="im-request">Sample request</label><select id="im-request"><option value="admin" ${request==='admin'?'selected':''}>Administrator · known process</option><option value="ssh" ${request==='ssh'?'selected':''}>SSH signing</option><option value="unknown" ${request==='unknown'?'selected':''}>Administrator · unknown source</option></select></div><section class="dialog" aria-label="Fingerprint approval"><div class="row spread"><h3>${waiting?'Fingerprint approval':s.outcome==='approved'?'Request approved':s.outcome==='rejected'?'Request rejected':'Request expired'}</h3>${icon(waiting?'fingerprint':s.outcome==='approved'?'check':'shield-x')}</div><p class="muted">${request==='ssh'?'SSH key operation':'Administrator authentication'}</p><div class="kv"><span>Process reported by macOS</span><span>${request==='unknown'?'Unknown — unavailable':request==='ssh'?'/usr/bin/ssh':'/usr/bin/sudo'}</span></div><p class="muted">The process snapshot does not verify the command below.</p><div class="detail"><h3>Requester-provided details</h3><code>${request==='ssh'?'Sign an SSH authentication request · sample key':request==='unknown'?'Command details unavailable':'sudo /usr/bin/true'}</code></div><p>${waiting?'Touch your immurok to approve only if you initiated and recognize this request.':s.outcome==='approved'?'Sample fingerprint accepted. No real operation was authorized.':s.outcome==='rejected'?'The sample request was denied. No operation was performed.':'The sample request timed out. Start a new request to try again.'}</p><div class="row spread"><span id="im-timer" aria-live="off" class="muted">${waiting?`${s.seconds}s remaining`:'Request closed'}</span>${waiting?'<button data-act="reject">Reject · Esc</button>':'<button data-act="retry">New sample request</button>'}</div></section><div class="labs"><div class="eyebrow">PREVIEW CONTROLS · NOT APP APPROVAL BUTTONS</div><div class="row"><button data-act="approve" ${!waiting?'disabled':''}>Simulate device fingerprint</button><button data-act="expire" ${!waiting?'disabled':''}>Simulate timeout</button></div></div>`;}
function device(){const d=statuses[s.scenario];return `<div class="row spread"><div><h2>Your immurok</h2><span class="muted">Sample device · Desktop Mac</span></div><label>Preview scenario <select id="im-scenario">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${k===s.scenario?'selected':''}>${v[0]}</option>`).join('')}</select></label></div><section class="status"><h3 class="${d[3]}">${icon(d[3]==='check'?'shield-check':'circle-alert')} ${d[0]}</h3><p>${d[1]}</p><button data-act="recover">${d[2]}</button></section><div class="kv"><span>Connection</span><span>${['disconnected','permission','off'].includes(s.scenario)?'Not connected':'Bluetooth connected'}</span><span>Battery</span><span>${s.scenario==='low'?'12%':'82%'} · Last reported in sample data</span><span>USB-C</span><span>Charging does not establish Bluetooth trust</span><span>Selected features</span><span>${s.features.length?s.features.map(x=>features[x][0]).join(', '):'None selected in onboarding'}</span></div><button data-act="setup">${s.features.length?'Review setup':'Choose features'}</button><div class="labs"><div class="row spread"><h3>Approval history · This preview session</h3><button data-act="clear" ${!s.history.length?'disabled':''}>Clear history</button></div><p class="muted">Only service and outcome are shown. No commands, passwords, key names, or device identifiers are retained.</p><ul>${s.history.length?s.history.map(h=>`<li>${h.service==='SSH'?'SSH':'Administrator'} · ${['approved','rejected','expired'].includes(h.result)?h.result:'closed'}</li>`).join(''):'<li>No sample requests yet.</li>'}</ul></div>`;}
function render(){clearInterval(ticker);root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===s.view)));main.innerHTML=s.view==='setup'?setup():s.view==='approval'?approval():device();if(s.view==='approval'&&s.outcome==='waiting'){ticker=setInterval(()=>{s.seconds--;const t=root.querySelector('#im-timer');if(t)t.textContent=`${s.seconds}s remaining`;if(s.seconds<=0)finish('expired');},1000);}}
function finish(result){s.outcome=result;s.history.unshift({service:s.request==='ssh'?'SSH':'Administrator',result});s.history=s.history.slice(0,50);save();render();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act;if(b.dataset.view){s.view=b.dataset.view;}else if(b.dataset.feature){const f=b.dataset.feature;s.features=s.features.includes(f)?s.features.filter(x=>x!==f):[...s.features,f];}else if(a==='complete'){s.done=[...new Set([...s.done,steps()[s.step]])];}else if(a==='back'){s.step=Math.max(0,s.step-1);}else if(a==='next'||a==='skip'){if(s.step===steps().length-1){s.view='device';const missing=steps().find(x=>stepInfo[x]&&!s.done.includes(x));s.scenario=({connect:'disconnected',pair:'unverified',enroll:'enroll',password:'password',accessibility:'accessibility',pam:'pam'})[missing]||'ready';}else s.step++;}else if(a==='resume'){s.step=steps().findIndex(x=>stepInfo[x]&&!s.done.includes(x));}else if(a==='approve'||a==='reject'||a==='expire'){finish(a==='approve'?'approved':a==='reject'?'rejected':'expired');return;}else if(a==='retry'){s.outcome='waiting';s.seconds=30;}else if(a==='recover'){if(s.scenario==='ready'){s.view='approval';s.outcome='waiting';s.seconds=30;}else s.scenario='ready';}else if(a==='setup'){s.view='setup';s.step=0;}else if(a==='clear'){s.history=[];}save();render();});
root.addEventListener('change',e=>{if(e.target.id==='im-scenario')s.scenario=e.target.value;if(e.target.id==='im-request'){s.request=e.target.value;s.outcome='waiting';s.seconds=30;}save();render();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.view==='approval'&&s.outcome==='waiting'){e.preventDefault();finish('rejected');}});
render();
})();
</script>
</div>

</body>
</html>
